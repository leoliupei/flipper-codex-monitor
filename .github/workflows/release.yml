name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify tag and release metadata
        run: |
          python scripts/check_release.py
          version=$(cat VERSION)
          case "$GITHUB_REF_NAME" in
            "v$version"|"v$version-"*) ;;
            *) echo "tag $GITHUB_REF_NAME does not match VERSION $version" >&2; exit 1 ;;
          esac

      - name: Run tests
        run: PYTHONPATH="$PWD:$PWD/bridge" python -m unittest discover -s bridge/tests -v

      - name: Compile the native Bluetooth helper
        run: |
          xcrun swiftc -swift-version 5 -O \
            -framework Foundation -framework CoreBluetooth \
            bridge/macos_ble_helper/main.swift \
            -o /tmp/codex-flipper-ble

      - name: Install the pinned Flipper SDK
        run: >-
          ufbt update
          --url https://update.flipperzero.one/builds/firmware/1.4.3/flipper-z-f7-sdk-1.4.3.zip

      - name: Build release files
        run: |
          (cd flipper && ufbt)
          mkdir -p release
          cp flipper/dist/codex_monitor.fap "release/codex-monitor-$(cat VERSION).fap"
          (cd release && shasum -a 256 ./* > SHA256SUMS.txt)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in
            *-*) prerelease=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "Flipper Codex Monitor $GITHUB_REF_NAME" \
            --generate-notes \
            "${prerelease[@]}"
