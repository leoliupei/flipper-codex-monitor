name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify tag and release metadata
        run: |
          python scripts/check_release.py
          version=$(cat VERSION)
          case "$GITHUB_REF_NAME" in
            "v$version"|"v$version-"*) ;;
            *) echo "tag $GITHUB_REF_NAME does not match VERSION $version" >&2; exit 1 ;;
          esac

      - name: Run tests
        run: PYTHONPATH="$PWD:$PWD/bridge" python -m unittest discover -s bridge/tests -v

      - name: Compile the native Bluetooth helper
        run: |
          xcrun swiftc -swift-version 5 -O \
            -framework Foundation -framework CoreBluetooth \
            bridge/macos_ble_helper/main.swift \
            -o /tmp/codex-flipper-ble

      - name: Install the pinned Flipper SDK
        run: >-
          ufbt update
          --url https://update.flipperzero.one/builds/firmware/1.4.3/flipper-z-f7-sdk-1.4.3.zip

      - name: Build release files
        run: |
          (cd flipper && ufbt)
          mkdir -p release
          cp flipper/dist/codex_monitor.fap "release/codex-monitor-$(cat VERSION).fap"
          (cd release && shasum -a 256 ./* > SHA256SUMS.txt)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in
            *-*) prerelease=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "Flipper Codex Monitor $GITHUB_REF_NAME" \
            --generate-notes \
            "${prerelease[@]}"
