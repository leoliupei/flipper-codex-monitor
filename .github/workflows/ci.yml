name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run bridge and installer tests
        run: PYTHONPATH="$PWD:$PWD/bridge" python -m unittest discover -s bridge/tests -v

      - name: Check release metadata
        run: python scripts/check_release.py

      - name: Compile the native Bluetooth helper
        run: |
          xcrun swiftc -swift-version 5 -O \
            -framework Foundation -framework CoreBluetooth \
            bridge/macos_ble_helper/main.swift \
            -o /tmp/codex-flipper-ble

      - name: Install the pinned Flipper SDK
        run: >-
          ufbt update
          --url https://update.flipperzero.one/builds/firmware/1.4.3/flipper-z-f7-sdk-1.4.3.zip

      - name: Build the FAP
        working-directory: flipper
        run: ufbt

      - name: Upload the FAP build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-monitor-fap
          path: flipper/dist/codex_monitor.fap
          if-no-files-found: error
